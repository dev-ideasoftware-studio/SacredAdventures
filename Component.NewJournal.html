                if (!img.closest('.page-flipper') && window.getComputedStyle(img).display !== 'none') {
                    const rect = img.getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                        targetId = img.getAttribute('data-selfie-target');
                        rects.push({ x: rect.x, y: rect.y, width: rect.width, height: rect.height });
                    }
                }
            }
            if (rects.length > 0) {
                window.parent.postMessage({ type: 'REQ_ALIGN_SELFIE', target: targetId, rect: rects[0] }, '*');
            } else {
                window.parent.postMessage({ type: 'REQ_HIDE_SELFIE' }, '*');
            }
        }

        function scheduleAlign() {
            if (window._isBookVisibleOverride === false) return;
            alignTipiCanvas();
            alignAxeCanvas();
            alignSelfieCanvas();
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.ResizeObserver) {
                const ro = new ResizeObserver(() => scheduleAlign());
                ro.observe(document.body);
            }
            if (window.MutationObserver) {
                const mo = new MutationObserver(() => scheduleAlign());
                const container = document.querySelector('.book-content');
                if (container) mo.observe(container, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
            }
        });

        window.addEventListener('message', (e) => {
            const d = e.data;
            if (!d) return;

            if (d.type === 'VISIBILITY_CHANGE') {
                window.isLogbookVisible = d.isVisible;
                window._isBookVisibleOverride = d.isVisible;
                if (d.isVisible) {
                    if (window._isClosingSequence) window._isClosingSequence = false;
                    if (window.initiateOpenSequence && (!window.journal3D || !window.journal3D.isOpen)) window.initiateOpenSequence();
                } else {
                    window._isClosingSequence = true;
                    if (window.initiateCloseSequence) window.initiateCloseSequence();
                    try { window.parent.postMessage({ type: 'REQ_HIDE_TIPI' }, '*'); window.parent.postMessage({ type: 'REQ_HIDE_AXE' }, '*'); } catch (e) { }
                }
            }

            if (d.type === 'DO_OPEN_FLIP') if (window.initiateOpenSequence) initiateOpenSequence();
            if (d.type === 'GO_TO_PAGE') {
                if (typeof d.pageIdx === 'number') {
                    game.currentPageIdx = Math.min(game.pages.length - 1, Math.max(0, d.pageIdx));
                    if (game.currentPageIdx % 2 !== 0) game.currentPageIdx--;
                    if (typeof updateBookView === 'function') updateBookView();
                }
            }
            if (d.type === 'SWITCH_TAB') if (typeof window.switchBookTab === 'function') window.switchBookTab(d.tab);
            if (d.type === 'ADD_PAGE') window.addPage(d.category, d.title, d.text, d.state, d.imageUrl, d.videoUrl, d.buttonLabel, d.buttonAction);

            if (d.type === 'NLP_RESPONSE') {
                const logEl = document.getElementById('parser-feedback');
                if (logEl) {
                    logEl.textContent = d.msg;
                    logEl.style.color = '#86efac';
                    setTimeout(() => { if (logEl.textContent === d.msg) { logEl.textContent = 'System loaded and awaiting input.'; logEl.style.color = '#d6d3d1'; } }, 6000);
                }
                const announcer = document.getElementById('sr-announcer');
                if (announcer) announcer.textContent = d.msg;
            }

            if (d.type === 'SHOW_BUILDING_INFO') {
                window.LOGBOOK_DATA.buildings = [{
                    pageId: 1,
                    title: `Tipi ${d.tipiId}`,
                    contentBlocks: [
                        { type: "html-box", html: `<p class="book-text">${d.ownerText}</p>` }
                    ]
                }];
                if (typeof window.switchBookTab === 'function') window.switchBookTab('buildings');
                if (window.initiateOpenSequence && (!window.journal3D || !window.journal3D.isOpen)) {
                    window.initiateOpenSequence();
                }
            }

            if (d.type === 'YB_GREETING_ARRIVED' || d.type === 'BHG_GREETING_ARRIVED') {
                // Remove all purple quest buttons from the log to permanently hide them
                if (game.log) {
                    game.log.forEach(page => {
                        if (page.button) {
                            delete page.button;
                        }
                    });
                }
                
                if (typeof window.switchBookTab === 'function') window.switchBookTab('log');
                if (typeof window.turnPage === 'function') {
                    game.currentPageIdx = 2; // Fixed logic to point to the correct spread
                    updateBookView();
                }
            }
        });
    </script>
</body>
