<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Adventures — Loading</title>
    <style>
        /* Visual language: 1:1 with legacy WORDPRESS/Component.LoadingModal.html (leather deck + Fredoka).
           Retains v2: dual MP4 paths, blob prefetch, gradient video fallback, a11y, safe log text. */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 50px;
            overflow: hidden;
            transition: opacity 0.5s ease-out;
            pointer-events: none;
        }
        #loading-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            will-change: transform, opacity;
            transform: translateZ(0);
            backface-visibility: hidden;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 0;
        }
        #loading-video-fallback {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 0;
            background: #111;
        }
        #loading.is-video-fallback #loading-video-fallback {
            display: block;
        }

        .loading-modal {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 50px;
            width: 400px;
            min-height: 280px;
            padding: 25px;
            background: linear-gradient(180deg, rgba(40, 26, 20, 0.95), rgba(15, 10, 8, 0.98));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 4px solid #8d6e63;
            border-bottom: 8px solid #5d4037;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(251, 192, 45, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 100;
            pointer-events: auto;
        }

        .loading-content-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loading-title {
            font-family: 'Fredoka One', sans-serif;
            font-size: 1.4rem;
            color: #fbc02d;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin: 0 0 5px 0;
            text-align: center;
        }
        .loading-subline {
            font-family: 'Outfit', sans-serif;
            font-size: 0.68rem;
            font-weight: 500;
            color: rgba(215, 204, 200, 0.65);
            text-align: center;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin: -2px 0 8px 0;
        }

        .diag-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .diag-label {
            display: flex;
            justify-content: space-between;
            color: #d7ccc8;
            font-size: 0.7rem;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .diag-label span:last-child { font-variant-numeric: tabular-nums; }
        .loading-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .loading-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #fbc02d, #f57f17);
            box-shadow: 0 0 10px rgba(251, 192, 45, 0.4);
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 2.0s ease-out;
            will-change: transform;
        }

        #loading-log {
            width: 100%;
            height: 45px;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            color: rgba(215, 204, 200, 0.4);
            text-align: center;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            line-height: 1.4;
        }

        .copyright {
            color: rgba(141, 110, 99, 0.4);
            font-size: 9px;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .gpu-slot-container {
            height: 1.2em;
            overflow: hidden;
            position: relative;
            display: inline-block;
            vertical-align: bottom;
            color: #fbc02d;
        }
        .gpu-slot-strip {
            display: flex;
            flex-direction: column;
            transform: translateY(0);
            will-change: transform;
        }
        @keyframes slotScroll {
            from { transform: translateY(0); }
            to { transform: translateY(-88.8em); }
        }
        .gpu-slot-active .gpu-slot-strip {
            animation: slotScroll 30s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            #loading, #loading-video, .loading-bar {
                transition: none;
            }
            .gpu-slot-active .gpu-slot-strip { animation: none; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading" role="presentation">
        <video id="loading-video" autoplay loop muted playsinline>
            <source src="WORDPRESS/Assets/AnimatedOpening.mp4" type="video/mp4">
            <source src="Assets/AnimatedOpening.mp4" type="video/mp4">
        </video>
        <div id="loading-video-fallback" aria-hidden="true"></div>

        <div class="loading-modal" role="status" aria-live="polite" aria-label="Game loading progress">
            <div class="loading-content-box">
                <div>
                    <h1 class="loading-title">Sacred Adventures</h1>
                    <p class="loading-subline">v2 engine · world &amp; Anu</p>
                </div>

                <div class="diag-row">
                    <div class="diag-label"><span>Downloading...</span><span id="p-video">0%</span></div>
                    <div class="loading-bar-container"><div id="bar-video" class="loading-bar"></div></div>
                </div>

                <div class="diag-row">
                    <div class="diag-label"><span>Loading...</span><span id="p-assets">0%</span></div>
                    <div class="loading-bar-container"><div id="bar-assets" class="loading-bar"></div></div>
                </div>

                <div class="diag-row">
                    <div class="diag-label">
                        <span>Processing...</span>
                        <span id="p-logic">0%</span>
                        <span id="p-logic-slot" class="gpu-slot-container" style="display:none;" aria-hidden="true"></span>
                    </div>
                    <div class="loading-bar-container"><div id="bar-logic" class="loading-bar"></div></div>
                </div>

                <div class="diag-row">
                    <div class="diag-label"><span>Initializing...</span><span id="p-init">0%</span></div>
                    <div class="loading-bar-container"><div id="bar-init" class="loading-bar"></div></div>
                </div>

                <div id="loading-log" aria-live="polite" aria-relevant="additions"></div>
            </div>

            <div class="copyright">Sacred Ones &bull; Est. 2026</div>
        </div>
    </div>

    <script>
        (function () {
            const LOADING_ROOT = document.getElementById('loading');
            const video = document.getElementById('loading-video');
            const VIDEO_CANDIDATES = [
                'WORDPRESS/Assets/AnimatedOpening.mp4',
                'Assets/AnimatedOpening.mp4',
            ];

            function notifyVideoReady() {
                try {
                    window.parent.postMessage({ type: 'VIDEO_READY', source: 'SacredLoadingModal' }, '*');
                } catch (_) {}
            }

            function showVideoFallback() {
                if (LOADING_ROOT) LOADING_ROOT.classList.add('is-video-fallback');
                video.style.display = 'none';
                notifyVideoReady();
            }

            (async function initVideo() {
                let srcUrl = null;
                let blobUrl = null;
                for (const path of VIDEO_CANDIDATES) {
                    try {
                        const r = await fetch(path, { cache: 'force-cache' });
                        if (!r.ok) continue;
                        const blob = await r.blob();
                        blobUrl = URL.createObjectURL(blob);
                        srcUrl = blobUrl;
                        break;
                    } catch (_) {}
                }

                if (!srcUrl) {
                    console.warn('[LoadingModal] No opening video (tried:', VIDEO_CANDIDATES.join(', '), ')');
                    showVideoFallback();
                    return;
                }

                video.src = srcUrl;
                video.load();

                video.onplaying = () => {
                    video.style.opacity = '1';
                    notifyVideoReady();
                };

                video.onerror = () => {
                    if (blobUrl) URL.revokeObjectURL(blobUrl);
                    showVideoFallback();
                };

                try {
                    await video.play();
                } catch (e) {
                    console.warn('[LoadingModal] Autoplay blocked:', e);
                    notifyVideoReady();
                }
            })();

            function isHeavyMainThreadParseMessage(msg) {
                if (!msg || typeof msg !== 'string') return false;
                if (msg.includes('Avatar (78MB)')) return true;
                if (/Avatar3\.glb/i.test(msg)) return true;
                if (/NPC\.YB\.glb/i.test(msg)) return true;
                return false;
            }

            function isParseCompleteMessage(msg) {
                if (!msg || typeof msg !== 'string') return false;
                return msg.includes('Avatar Loaded');
            }

            window.addEventListener('message', (event) => {
                const data = event.data;
                if (!data || !data.type) return;

                switch (data.type) {
                    case 'LOG_SYSTEM': {
                        const msg = data.msg;
                        const pVideo = data.pVideo;
                        const pAssets = data.pAssets;
                        const pLogic = data.pLogic;
                        const pInit = data.pInit;

                        const logBox = document.getElementById('loading-log');
                        if (logBox && msg) {
                            const now = new Date();
                            const timeStr = [now.getHours(), now.getMinutes(), now.getSeconds()]
                                .map((n) => String(n).padStart(2, '0')).join(':');
                            const logEntry = document.createElement('div');
                            logEntry.textContent = '[' + timeStr + '] ' + msg;
                            logBox.appendChild(logEntry);
                            while (logBox.children.length > 12) logBox.removeChild(logBox.firstChild);
                            logBox.scrollTop = logBox.scrollHeight;
                        }

                        let actualVideo = pVideo;
                        let actualAssets = pAssets;
                        let actualLogic = pLogic;
                        let actualInit = pInit;

                        if (isHeavyMainThreadParseMessage(msg)) {
                            actualLogic = 99;

                            if (!window._gpuSlideStarted) {
                                window._gpuSlideStarted = true;
                                const logicBar = document.getElementById('bar-logic');
                                if (logicBar) {
                                    logicBar.style.transition = 'transform 30s cubic-bezier(0.1, 0.7, 0.1, 1)';
                                    logicBar.style.transform = 'scaleX(0.99)';
                                }

                                const pLogicEl = document.getElementById('p-logic');
                                if (pLogicEl) pLogicEl.style.display = 'none';

                                const pSlot = document.getElementById('p-logic-slot');
                                if (pSlot) {
                                    if (!pSlot.innerHTML) {
                                        let strip = '<div class="gpu-slot-strip">';
                                        for (let i = 25; i <= 99; i++) {
                                            strip += '<div style="height:1.2em;line-height:1.2em;">' + i + '%</div>';
                                        }
                                        strip += '</div>';
                                        pSlot.innerHTML = strip;
                                    }
                                    pSlot.style.display = 'inline-block';
                                    pSlot.classList.add('gpu-slot-active');
                                }
                            }

                            actualAssets = 100;
                        }

                        if (isParseCompleteMessage(msg)) {
                            const logicBar = document.getElementById('bar-logic');
                            if (logicBar) {
                                logicBar.style.transition = 'transform 0.4s ease-out';
                            }
                            actualLogic = 100;
                        }

                        if (actualVideo !== undefined) {
                            const el = document.getElementById('bar-video');
                            if (el) el.style.transform = 'scaleX(' + actualVideo / 100 + ')';
                            const lab = document.getElementById('p-video');
                            if (lab) lab.textContent = Math.round(actualVideo) + '%';
                        }
                        if (actualAssets !== undefined) {
                            const el = document.getElementById('bar-assets');
                            if (el) el.style.transform = 'scaleX(' + actualAssets / 100 + ')';
                            const lab = document.getElementById('p-assets');
                            if (lab) lab.textContent = Math.round(actualAssets) + '%';
                        }
                        if (actualLogic !== undefined) {
                            if (actualLogic === 100 || !window._gpuSlideStarted) {
                                const pSlot = document.getElementById('p-logic-slot');
                                if (pSlot) pSlot.style.display = 'none';

                                const pLogicEl = document.getElementById('p-logic');
                                if (pLogicEl) {
                                    pLogicEl.style.display = 'inline';
                                    pLogicEl.textContent = Math.round(actualLogic) + '%';
                                }
                                const logicBar = document.getElementById('bar-logic');
                                if (logicBar) logicBar.style.transform = 'scaleX(' + actualLogic / 100 + ')';
                            }
                        }
                        if (actualInit !== undefined) {
                            const el = document.getElementById('bar-init');
                            if (el) el.style.transform = 'scaleX(' + actualInit / 100 + ')';
                            const lab = document.getElementById('p-init');
                            if (lab) lab.textContent = Math.round(actualInit) + '%';
                        }
                        break;
                    }
                    case 'LOADING_COMPLETE': {
                        const ld = document.getElementById('loading');
                        if (ld) {
                            ld.style.opacity = '0';
                            ld.style.pointerEvents = 'none';
                        }
                        break;
                    }
                    default:
                        break;
                }
            });
        })();
    </script>
</body>
</html>
