<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading Screen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #111; /* Dark base so video pops */
            display: flex;
            align-items: flex-end; /* Move to bottom */
            justify-content: center;
            padding-bottom: 50px; /* +50px from bottom viewport */
            overflow: hidden;
            transition: opacity 0.5s ease-out;
            pointer-events: none; /* Let clicks pass through transparent areas */
        }
        #loading-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Force GPU layer to prevent stutters during main thread heavy load */
            will-change: transform, opacity;
            transform: translateZ(0);
            backface-visibility: hidden;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 0;
        }
        .loading-modal {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 50px;
            width: 400px; /* Reduced width by 50% */
            min-height: 280px;
            padding: 25px; 
            background: linear-gradient(180deg, rgba(40, 26, 20, 0.95), rgba(15, 10, 8, 0.98));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            
            border: 4px solid #8d6e63;
            border-bottom: 8px solid #5d4037; 
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(251, 192, 45, 0.1);
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 100;
        }

        .loading-content-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loading-title {
            font-family: 'Fredoka One', sans-serif;
            font-size: 1.4rem;
            color: #fbc02d;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            margin: 0 0 5px 0;
            text-align: center;
        }

        /* Diagnostic Bar Styling */
        .diag-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .diag-label {
            display: flex;
            justify-content: space-between;
            color: #d7ccc8;
            font-size: 0.7rem;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .loading-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .loading-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #fbc02d, #f57f17);
            box-shadow: 0 0 10px rgba(251, 192, 45, 0.4);
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 2.0s ease-out;
            will-change: transform;
        }

        #loading-log {
            width: 100%;
            height: 45px;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            color: rgba(215, 204, 200, 0.4);
            text-align: center;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            line-height: 1.4;
        }

        .copyright {
            color: rgba(141, 110, 99, 0.4);
            font-size: 9px;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
            100% { opacity: 0.6; }
        }
        /* GPU Hardware Accelerated Slot-Machine Counter (Universal Compatibility) */
        .gpu-slot-container {
            height: 1.2em;
            overflow: hidden;
            position: relative;
            display: inline-block;
            vertical-align: bottom;
            color: #fbc02d;
        }
        .gpu-slot-strip {
            display: flex;
            flex-direction: column;
            transform: translateY(0);
            will-change: transform;
        }
        @keyframes slotScroll {
            from { transform: translateY(0); }
            to { transform: translateY(-88.8em); }
        }
        .gpu-slot-active .gpu-slot-strip {
            animation: slotScroll 30s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading">
        <video id="loading-video" autoplay loop muted playsinline>
            <source src="Assets/AnimatedOpening.mp4" type="video/mp4">
        </video>
        
        <div class="loading-modal">
            <div class="loading-content-box">
                <h1 class="loading-title">Sacred Adventures</h1>
                
                <!-- Multi-Tier Diagnostic Bars -->
                <div class="diag-row">
                    <div class="diag-label"><span>Downloading...</span><span id="p-video">0%</span></div>
                    <div class="loading-bar-container"><div id="bar-video" class="loading-bar"></div></div>
                </div>

                <div class="diag-row">
                    <div class="diag-label"><span>Loading...</span><span id="p-assets">0%</span></div>
                    <div class="loading-bar-container"><div id="bar-assets" class="loading-bar"></div></div>
                </div>

                <div class="diag-row">
                    <div class="diag-label">
                        <span>Processing...</span>
                        <span id="p-logic">0%</span>
                        <span id="p-logic-slot" class="gpu-slot-container" style="display:none;"></span>
                    </div>
                    <div class="loading-bar-container"><div id="bar-logic" class="loading-bar"></div></div>
                </div>

                <div class="diag-row">
                    <div class="diag-label"><span>Initializing...</span><span id="p-init">0%</span></div>
                    <div class="loading-bar-container"><div id="bar-init" class="loading-bar"></div></div>
                </div>

                <div id="loading-log"></div>
            </div>
            
            <div class="copyright">Sacred Ones &bull; Est. 2026</div>
        </div>
    </div>

    <script>
        // MEMORY-SAFE VIDEO BOOTLOADER
        // Architected to ensure zero-stutter playback by loading into RAM blob
        (async function initVideo() {
            const video = document.getElementById('loading-video');
            const videoPath = 'Assets/AnimatedOpening.mp4';
            
            try {
                console.log("[LoadingModal] Pre-fetching Cinematic MP4 to Memory...");
                const response = await fetch(videoPath);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                video.src = blobUrl;
                video.load();
                
                // Wait for video to be ready and playing before notifying parent
                video.onplaying = () => {
                    console.log("[LoadingModal] Cinematic Video Active and In-Memory. Firing Ready Signal.");
                    video.style.opacity = '1';
                    window.parent.postMessage({ type: 'VIDEO_READY' }, '*');
                };
                
                video.play().catch(e => {
                    console.warn("Autoplay blocked or failed:", e);
                    // Fallback to notifying parent anyway so we don't hang
                    window.parent.postMessage({ type: 'VIDEO_READY' }, '*');
                });
            } catch (e) {
                console.error("Video Fetch Failed:", e);
                window.parent.postMessage({ type: 'VIDEO_READY' }, '*');
            }
        })();

        // Listen for messages from the parent window
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type) {
                switch(event.data.type) {
                    case 'LOG_SYSTEM':
                        const msg = event.data.msg;
                        const pVideo = event.data.pVideo;
                        const pAssets = event.data.pAssets;
                        const pLogic = event.data.pLogic;
                        const pInit = event.data.pInit;
                        
                        const logBox = document.getElementById('loading-log');
                        
                        if (logBox && msg) {
                            const now = new Date();
                            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                                           now.getMinutes().toString().padStart(2, '0') + ":" + 
                                           now.getSeconds().toString().padStart(2, '0');
                            
                            const logEntry = document.createElement('div');
                            logEntry.innerHTML = `[${timeStr}] ${msg}`;
                            logBox.appendChild(logEntry);
                            logBox.scrollTop = logBox.scrollHeight;
                        }
                        
                        let actualVideo = pVideo;
                        let actualAssets = pAssets;
                        let actualLogic = pLogic;
                        let actualInit = pInit;

                        if (msg && msg.includes("Avatar (78MB)")) {
                            // INTERCEPT: The massive 78MB synchronous parse is about to lock the main thread for 10 seconds!
                            // We instantly set the CSS transition to 10 seconds and push the target to 99%
                            actualLogic = 99;
                            
                            if (!window._gpuSlideStarted) {
                                window._gpuSlideStarted = true;
                                const logicBar = document.getElementById('bar-logic');
                                if (logicBar) {
                                    logicBar.style.transition = 'transform 30s cubic-bezier(0.1, 0.7, 0.1, 1)';
                                    logicBar.style.transform = `scaleX(0.99)`;
                                }
                                
                                const pLogic = document.getElementById('p-logic');
                                pLogic.style.display = 'none'; // Hide static text
                                
                                const pSlot = document.getElementById('p-logic-slot');
                                if (pSlot) {
                                    if (!pSlot.innerHTML) {
                                        let strip = '<div class="gpu-slot-strip">';
                                        for (let i = 25; i <= 99; i++) {
                                            strip += `<div style="height:1.2em; line-height:1.2em;">${i}%</div>`;
                                        }
                                        strip += '</div>';
                                        pSlot.innerHTML = strip;
                                    }
                                    pSlot.style.display = 'inline-block';
                                    pSlot.classList.add('gpu-slot-active');
                                }
                            }
                            
                            // Also push assets to 100% just in case it got stuck at 95%
                            actualAssets = 100;
                        }

                        if (msg && msg.includes("Avatar Loaded")) {
                            // Lockup is over! Snap transition back to fast
                            const logicBar = document.getElementById('bar-logic');
                            if (logicBar) {
                                logicBar.style.transition = 'transform 0.4s ease-out';
                            }
                            actualLogic = 100;
                        }

                        // Update Bars and Labels
                        if (actualVideo !== undefined) {
                            document.getElementById('bar-video').style.transform = `scaleX(${actualVideo / 100})`;
                            document.getElementById('p-video').innerText = Math.round(actualVideo) + '%';
                        }
                        if (actualAssets !== undefined) {
                            document.getElementById('bar-assets').style.transform = `scaleX(${actualAssets / 100})`;
                            document.getElementById('p-assets').innerText = Math.round(actualAssets) + '%';
                        }
                        if (actualLogic !== undefined) {
                            // Only update if it's the final snap to 100%, otherwise let the GPU counter handle it!
                            if (actualLogic === 100 || !window._gpuSlideStarted) {
                                const pSlot = document.getElementById('p-logic-slot');
                                if (pSlot) pSlot.style.display = 'none';
                                
                                const pLogic = document.getElementById('p-logic');
                                pLogic.style.display = 'inline';
                                pLogic.innerText = Math.round(actualLogic) + '%';
                                document.getElementById('bar-logic').style.transform = `scaleX(${actualLogic / 100})`;
                            }
                        }
                        if (actualInit !== undefined) {
                            document.getElementById('bar-init').style.transform = `scaleX(${actualInit / 100})`;
                            document.getElementById('p-init').innerText = Math.round(actualInit) + '%';
                        }
                        break;
                    case 'LOADING_COMPLETE':
                        const ld = document.getElementById('loading');
                        if (ld) {
                            ld.style.opacity = '0';
                            ld.style.pointerEvents = 'none'; // CRITICAL: Stop blocking clicks after fade!
                        }
                        break;
                }
            }
        });
    </script>
</body>
</html>
