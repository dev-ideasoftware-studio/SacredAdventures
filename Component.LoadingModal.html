<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Adventures — Loading</title>
    <style>
        /* Visual language: 1:1 with legacy WORDPRESS/Component.LoadingModal.html (leather deck + Fredoka).
           Retains v2: dual MP4 paths, blob prefetch, gradient video fallback, a11y, safe log text. */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 50px;
            overflow: hidden;
            transition: opacity 0.5s ease-out;
            pointer-events: none;
        }
        #loading-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            will-change: transform, opacity;
            transform: translateZ(0);
            backface-visibility: hidden;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 0;
        }
        #loading-video-fallback {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 0;
            background: #111;
        }
        #loading.is-video-fallback #loading-video-fallback {
            display: block;
        }

        .loading-modal {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 50px;
            width: 400px;
            min-height: 280px;
            padding: 25px;
            background: linear-gradient(180deg, rgba(40, 26, 20, 0.95), rgba(15, 10, 8, 0.98));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 4px solid #8d6e63;
            border-bottom: 8px solid #5d4037;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(251, 192, 45, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 100;
            pointer-events: auto;
        }

        .loading-content-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loading-title {
            font-family: 'Fredoka One', sans-serif;
            font-size: 1.4rem;
            color: #fbc02d;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin: 0 0 5px 0;
            text-align: center;
        }
        .loading-subline {
            font-family: 'Outfit', sans-serif;
            font-size: 0.68rem;
            font-weight: 500;
            color: rgba(215, 204, 200, 0.65);
            text-align: center;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin: -2px 0 8px 0;
        }

        .diag-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .diag-label {
            display: flex;
            justify-content: space-between;
            color: #d7ccc8;
            font-size: 0.7rem;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .diag-label span:last-child { font-variant-numeric: tabular-nums; }

        /**
         * Shared layout for every % cell — odometer well + GPU slot well.
         *
         * Eager-applying these to BOTH `[id^="p-"]` percentage spans AND the
         * GPU slot container guarantees that the four rows sit on the same
         * baseline before any update arrives. Earlier the layout was only
         * applied inside `ensureOdometer` on first non-zero update, so a row
         * still at 0 (e.g. Init before its first message) rendered as plain
         * text "0%" with the default inline baseline while the row above it
         * was already an inline-block clipped well — visibly different
         * vertical positions per row. (May-14 2026 user fix.)
         */
        .diag-label .pct-cell,
        .gpu-slot-container {
            display: inline-block;
            height: 1.2em;
            line-height: 1.2em;
            overflow: hidden;
            vertical-align: bottom;
            text-align: right;
            font-variant-numeric: tabular-nums;
            min-width: 2.6em;
        }
        .diag-label .pct-cell .odo-strip { will-change: transform; }
        .diag-label .pct-cell .odo-strip > div { height: 1.2em; line-height: 1.2em; text-align: right; }
        .loading-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .loading-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #fbc02d, #f57f17);
            box-shadow: 0 0 10px rgba(251, 192, 45, 0.4);
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 2.0s ease-out;
            will-change: transform;
        }

        #loading-log {
            width: 100%;
            height: 45px;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            color: rgba(215, 204, 200, 0.4);
            text-align: center;
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            line-height: 1.4;
        }

        .copyright {
            color: rgba(141, 110, 99, 0.4);
            font-size: 9px;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .gpu-slot-container {
            height: 1.2em;
            overflow: hidden;
            position: relative;
            display: inline-block;
            vertical-align: bottom;
            color: #fbc02d;
        }
        .gpu-slot-strip {
            display: flex;
            flex-direction: column;
            transform: translateY(0);
            will-change: transform;
        }
        @keyframes slotScroll {
            from { transform: translateY(0); }
            to { transform: translateY(-88.8em); }
        }
        .gpu-slot-active .gpu-slot-strip {
            animation: slotScroll 30s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            #loading, #loading-video, .loading-bar {
                transition: none;
            }
            .gpu-slot-active .gpu-slot-strip { animation: none; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading" role="presentation">
        <video id="loading-video" autoplay loop muted playsinline>
            <source src="Assets/landscape-scenes/cinematic/animated-opening.mp4" type="video/mp4">
        </video>
        <div id="loading-video-fallback" aria-hidden="true"></div>

        <div class="loading-modal" role="status" aria-live="polite" aria-label="Game loading progress">
            <div class="loading-content-box">
                <div>
                    <h1 class="loading-title">Sacred Adventures</h1>
                    <p class="loading-subline">v2 engine · world &amp; UNIVERSE.ANU</p>
                </div>

                <div class="diag-row">
                    <div class="diag-label"><span>Downloading...</span><span id="p-video" class="pct-cell">0%</span></div>
                    <div class="loading-bar-container"><div id="bar-video" class="loading-bar"></div></div>
                </div>

                <div class="diag-row">
                    <div class="diag-label"><span>Loading...</span><span id="p-assets" class="pct-cell">0%</span></div>
                    <div class="loading-bar-container"><div id="bar-assets" class="loading-bar"></div></div>
                </div>

                <div class="diag-row">
                    <div class="diag-label">
                        <span>Processing...</span>
                        <span id="p-logic" class="pct-cell">0%</span>
                        <span id="p-logic-slot" class="gpu-slot-container" style="display:none;" aria-hidden="true"></span>
                    </div>
                    <div class="loading-bar-container"><div id="bar-logic" class="loading-bar"></div></div>
                </div>

                <div class="diag-row">
                    <div class="diag-label"><span>Initializing...</span><span id="p-init" class="pct-cell">0%</span></div>
                    <div class="loading-bar-container"><div id="bar-init" class="loading-bar"></div></div>
                </div>

                <div id="loading-log" aria-live="polite" aria-relevant="additions"></div>
            </div>

            <div class="copyright">Idea Software Studio &copy; 2026</div>
        </div>
    </div>

    <script>
        (function () {
            const LOADING_ROOT = document.getElementById('loading');
            const video = document.getElementById('loading-video');
            const VIDEO_CANDIDATES = [
                'Assets/landscape-scenes/cinematic/animated-opening.mp4',
            ];

            function notifyVideoReady() {
                try {
                    window.parent.postMessage({ type: 'VIDEO_READY', source: 'SacredLoadingModal' }, '*');
                } catch (_) {}
            }

            function showVideoFallback() {
                if (LOADING_ROOT) LOADING_ROOT.classList.add('is-video-fallback');
                video.style.display = 'none';
                notifyVideoReady();
            }

            (async function initVideo() {
                let srcUrl = null;
                let blobUrl = null;
                for (const path of VIDEO_CANDIDATES) {
                    try {
                        const r = await fetch(path, { cache: 'force-cache' });
                        if (!r.ok) continue;
                        const blob = await r.blob();
                        blobUrl = URL.createObjectURL(blob);
                        srcUrl = blobUrl;
                        break;
                    } catch (_) {}
                }

                if (!srcUrl) {
                    console.warn('[LoadingModal] No opening video (tried:', VIDEO_CANDIDATES.join(', '), ')');
                    showVideoFallback();
                    return;
                }

                video.src = srcUrl;
                video.load();

                video.onplaying = () => {
                    video.style.opacity = '1';
                    notifyVideoReady();
                };

                video.onerror = () => {
                    if (blobUrl) URL.revokeObjectURL(blobUrl);
                    showVideoFallback();
                };

                try {
                    await video.play();
                } catch (e) {
                    console.warn('[LoadingModal] Autoplay blocked:', e);
                    notifyVideoReady();
                }
            })();

            function isHeavyMainThreadParseMessage(msg) {
                if (!msg || typeof msg !== 'string') return false;
                if (msg.includes('Avatar (78MB)')) return true;
                if (/Avatar3\.glb/i.test(msg)) return true;
                if (/NPC\.YB\.glb/i.test(msg)) return true;
                return false;
            }

            function isParseCompleteMessage(msg) {
                if (!msg || typeof msg !== 'string') return false;
                return msg.includes('Avatar Loaded');
            }

            /**
             * Per-row odometer state — unified visual language for every row.
             *
             * Replaces the earlier two-stage `tweenPercentLabel` + `flipToHundred`
             * pair (May-12 follow-up). All four rows now use the SAME mechanism
             * as the Processing GPU slot: a vertical strip of "0%"…"100%" rows
             * scrolled via a CSS `translateY` transition. Every update — small
             * (5→8), medium (38→52), or final (98→100) — reads as a true
             * odometer flip, not a numeric counter snapping through values.
             *
             * The strip is built lazily on first non-zero update for each row
             * (101 rows). Subsequent updates animate `strip.style.transform`
             * to `translateY(-target * 1.2em)` and the CSS transition handles
             * the in-between frames smoothly.
             *
             * Two non-negotiable guards live in `applyRowUpdate`:
             *
             *   1. **NO BACKWARDS MOTION.** The host occasionally re-asserts
             *      LOWER values after higher ones — most notably the async
             *      VIDEO_READY → `v2LoadLog('Opening reel ready', 100, 8, 0, 0)`
             *      message which fires when the opening reel finishes
             *      buffering and can land AFTER later progress messages have
             *      pushed pAssets/pLogic/pInit above 8/0/0. Without the
             *      guard, `bar.style.transform = 'scaleX(0)'` runs through
             *      the CSS 2.0 s transition and the user sees the bars
             *      visibly EMPTY back to zero — the "bars start back over"
             *      regression the user reported.
             *
             *   2. **NO RE-FLIP AFTER 100.** Once a row's odometer lands on
             *      100 we set `flipped100 = true`; further updates are
             *      no-ops. Belt-and-suspenders for the host repeatedly
             *      asserting `pVideo=100` etc. on every later message.
             */
            /**
             * Fixed odometer flip duration (May-14 2026 user spec: "make sure
             * the numbers all flip up and have the same animation for each row
             * of progress loading"). Single value used by every row — no
             * delta-derived speed scaling, so a 5% bump on Init and a 92%
             * bump on Video both take exactly this long.
             */
            const ODOMETER_FLIP_MS = 600;

            const _odo = {
                video:  { strip: null, current: 0, flipped100: false },
                assets: { strip: null, current: 0, flipped100: false },
                logic:  { strip: null, current: 0, flipped100: false },
                init:   { strip: null, current: 0, flipped100: false },
            };

            /**
             * Build the strip and inject it eagerly at boot so the four rows
             * share an identical layout from the very first paint. Lazy init
             * meant rows still at 0 rendered as plain inline text while
             * updated rows were 1.2-em-clipped inline-blocks — the four
             * percentages visibly sat on different baselines until each row
             * got its first non-zero update. (.pct-cell now carries the
             * shared layout via CSS; the script just appends the strip.)
             */
            function buildOdometerStrip(key, labEl) {
                const state = _odo[key];
                if (state.strip) return state.strip;
                labEl.textContent = '';
                const strip = document.createElement('div');
                strip.className = 'odo-strip';
                strip.style.cssText =
                    'display:flex;flex-direction:column;' +
                    'transform:translateY(0em);' +
                    'transition:transform ' + ODOMETER_FLIP_MS + 'ms cubic-bezier(0.1,0.7,0.1,1);';
                for (let i = 0; i <= 100; i++) {
                    const row = document.createElement('div');
                    row.textContent = i + '%';
                    strip.appendChild(row);
                }
                labEl.appendChild(strip);
                state.strip = strip;
                void strip.offsetHeight;
                return strip;
            }

            function initAllOdometers() {
                const ids = { video: 'p-video', assets: 'p-assets', logic: 'p-logic', init: 'p-init' };
                Object.keys(ids).forEach((k) => {
                    const el = document.getElementById(ids[k]);
                    if (el) buildOdometerStrip(k, el);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initAllOdometers, { once: true });
            } else {
                initAllOdometers();
            }

            function animateOdometer(key, labEl, target) {
                const state = _odo[key];
                if (!state || !labEl) return;
                if (state.flipped100) return;
                const t = Math.max(0, Math.min(100, Number(target) || 0));
                if (t <= state.current) return;

                const strip = buildOdometerStrip(key, labEl);
                // Fixed duration for every row, every update — uniform feel.
                strip.style.transitionDuration = ODOMETER_FLIP_MS + 'ms';

                state.current = t;
                if (t >= 100) state.flipped100 = true;

                requestAnimationFrame(() => {
                    strip.style.transform =
                        'translateY(-' + (t * 1.2).toFixed(2) + 'em)';
                });
            }

            function applyRowUpdate(key, target, labId, barId) {
                if (target === undefined) return;
                const state = _odo[key];
                // Once we've flipped to 100, every subsequent update is a
                // no-op for BOTH the bar and the label.
                if (state && state.flipped100) return;
                const t = Math.max(0, Math.min(100, Number(target) || 0));
                // Hard no-backwards guard — see _odo doc-comment above. This
                // single line is what stops the late VIDEO_READY message
                // from rewinding the bars at the end of loading.
                if (state && t < state.current) return;

                const bar = document.getElementById(barId);
                if (bar) bar.style.transform = 'scaleX(' + (t / 100).toFixed(4) + ')';
                const lab = document.getElementById(labId);
                if (lab) animateOdometer(key, lab, t);
            }

            window.addEventListener('message', (event) => {
                const data = event.data;
                if (!data || !data.type) return;

                switch (data.type) {
                    case 'LOG_SYSTEM': {
                        const msg = data.msg;
                        const pVideo = data.pVideo;
                        const pAssets = data.pAssets;
                        const pLogic = data.pLogic;
                        const pInit = data.pInit;

                        const logBox = document.getElementById('loading-log');
                        if (logBox && msg) {
                            const now = new Date();
                            const timeStr = [now.getHours(), now.getMinutes(), now.getSeconds()]
                                .map((n) => String(n).padStart(2, '0')).join(':');
                            const logEntry = document.createElement('div');
                            logEntry.textContent = '[' + timeStr + '] ' + msg;
                            logBox.appendChild(logEntry);
                            while (logBox.children.length > 12) logBox.removeChild(logBox.firstChild);
                            logBox.scrollTop = logBox.scrollHeight;
                        }

                        let actualVideo = pVideo;
                        let actualAssets = pAssets;
                        let actualLogic = pLogic;
                        let actualInit = pInit;

                        if (isHeavyMainThreadParseMessage(msg)) {
                            actualLogic = 99;

                            if (!window._gpuSlideStarted) {
                                window._gpuSlideStarted = true;
                                const logicBar = document.getElementById('bar-logic');
                                if (logicBar) {
                                    logicBar.style.transition = 'transform 30s cubic-bezier(0.1, 0.7, 0.1, 1)';
                                    logicBar.style.transform = 'scaleX(0.99)';
                                }

                                const pLogicEl = document.getElementById('p-logic');
                                if (pLogicEl) pLogicEl.style.display = 'none';

                                const pSlot = document.getElementById('p-logic-slot');
                                if (pSlot) {
                                    if (!pSlot.innerHTML) {
                                        let strip = '<div class="gpu-slot-strip">';
                                        for (let i = 25; i <= 99; i++) {
                                            strip += '<div style="height:1.2em;line-height:1.2em;">' + i + '%</div>';
                                        }
                                        strip += '</div>';
                                        pSlot.innerHTML = strip;
                                    }
                                    pSlot.style.display = 'inline-block';
                                    pSlot.classList.add('gpu-slot-active');
                                }
                            }

                            actualAssets = 100;
                        }

                        if (isParseCompleteMessage(msg)) {
                            const logicBar = document.getElementById('bar-logic');
                            if (logicBar) {
                                logicBar.style.transition = 'transform 0.4s ease-out';
                            }
                            actualLogic = 100;
                        }

                        applyRowUpdate('video', actualVideo, 'p-video', 'bar-video');
                        applyRowUpdate('assets', actualAssets, 'p-assets', 'bar-assets');

                        if (actualLogic !== undefined) {
                            if (actualLogic === 100 || !window._gpuSlideStarted) {
                                // Transitioning out of (or never entered) the
                                // 25→99 GPU slot. Hide the slot, surface the
                                // p-logic label, and run the same odometer
                                // flip as the other rows. Seed
                                // `_odo.logic.current` to 99 so the strip
                                // initializes at 99 and flips just one row
                                // (99→100) — without this the freshly-built
                                // strip would render at 0 and scroll a long
                                // 0→100 ramp the user reads as "starting
                                // over" since the GPU slot already covered
                                // 25→99.
                                const pSlot = document.getElementById('p-logic-slot');
                                if (pSlot) pSlot.style.display = 'none';

                                const pLogicEl = document.getElementById('p-logic');
                                if (pLogicEl) {
                                    pLogicEl.style.display = 'inline';
                                    if (actualLogic >= 100 && window._gpuSlideStarted) {
                                        _odo.logic.current = 99;
                                    }
                                    applyRowUpdate('logic', actualLogic, 'p-logic', 'bar-logic');
                                } else {
                                    const logicBar = document.getElementById('bar-logic');
                                    if (logicBar) logicBar.style.transform = 'scaleX(' + actualLogic / 100 + ')';
                                }
                            }
                        }

                        applyRowUpdate('init', actualInit, 'p-init', 'bar-init');
                        break;
                    }
                    case 'LOADING_COMPLETE': {
                        // Defensive: force every row's odometer to land on
                        // 100 if the host hasn't already asserted it.
                        // Belt-and-suspenders for the perception "the bar
                        // didn't say 100%". Rows already flipped100=true
                        // are no-ops in applyRowUpdate.
                        const rows = [
                            { key: 'video',  lab: 'p-video',  bar: 'bar-video'  },
                            { key: 'assets', lab: 'p-assets', bar: 'bar-assets' },
                            { key: 'logic',  lab: 'p-logic',  bar: 'bar-logic'  },
                            { key: 'init',   lab: 'p-init',   bar: 'bar-init'   },
                        ];
                        for (const r of rows) {
                            // For logic specifically: if the GPU slot is still
                            // showing, hide it and surface p-logic before the
                            // flip — otherwise the user sees the slot snap
                            // away to a static 100%.
                            if (r.key === 'logic') {
                                const pSlot = document.getElementById('p-logic-slot');
                                if (pSlot) pSlot.style.display = 'none';
                                const pLogicEl = document.getElementById(r.lab);
                                if (pLogicEl) pLogicEl.style.display = 'inline';
                                if (window._gpuSlideStarted) {
                                    _odo.logic.current = Math.max(
                                        _odo.logic.current, 99
                                    );
                                }
                            }
                            applyRowUpdate(r.key, 100, r.lab, r.bar);
                        }

                        // Wait for the longest possible odometer flip
                        // duration before fading. animateOdometer caps at
                        // 720 ms and exits early once flipped100=true, so
                        // 720 ms is the upper bound + a small breathing
                        // margin.
                        setTimeout(() => {
                            const ld = document.getElementById('loading');
                            if (ld) {
                                ld.style.opacity = '0';
                                ld.style.pointerEvents = 'none';
                            }
                        }, 720);
                        break;
                    }
                    default:
                        break;
                }
            });
        })();
    </script>
</body>
</html>
