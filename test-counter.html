<!DOCTYPE html>
<html>
<head>
<style>
@property --load-percent {
  syntax: '<integer>';
  initial-value: 0;
  inherits: false;
}

@keyframes gpuCount {
  from { --load-percent: 25; }
  to { --load-percent: 99; }
}

.gpu-counter {
  animation: gpuCount 5s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
  counter-reset: load-percent var(--load-percent);
  color: red;
  font-size: 50px;
}
.gpu-counter::after {
  content: counter(load-percent) "%";
}
</style>
</head>
<body>
<span class="gpu-counter" id="test"></span>
</body>
</html>
